<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="psplusico.png">
    <title>Jackpot</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{font-size:max(min(1vw,1.7778vh),5.5px);--ox:max(0px,(100vw - 100rem)/2);--oy:max(0px,(100vh - 56.25rem)/2);--i:0}
        html,body{height:100%;overflow:hidden;background:#1e50b8;color:#fff;font-family:"SST","Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:300;user-select:none}
        #bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#1a44a4 0,#2a5fcb 55%,#1c47a6 100%)}
        #bg::before,#bg::after{content:"";position:absolute;width:170%;height:80%;left:-35%;border-radius:50%;transform:rotate(-7deg);background:linear-gradient(rgba(170,205,255,.3),rgba(170,205,255,.05));animation:sway 14s ease-in-out infinite alternate}
        #bg::before{bottom:-52%}
        #bg::after{bottom:-62%;animation-duration:19s;animation-direction:alternate-reverse}
        @keyframes sway{to{transform:rotate(-3deg) translateY(-3%)}}
        #home{position:fixed;inset:0;transition:opacity .5s,transform .7s}
        .playing #home{opacity:0;transform:scale(1.05)}
        #top{position:absolute;top:var(--oy);left:0;right:0;height:7.8rem;border-bottom:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.04)}
        .t{position:absolute;left:calc(var(--ox) + var(--x)*1rem);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:.9rem;font-size:1.5rem;white-space:nowrap}
        .t svg{width:2.6rem;height:2.6rem;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .t b{width:3rem;height:3rem;display:grid;place-items:center;border:.2rem solid #fff;border-radius:.5rem;font-size:1.8rem}
        .t .nt{font-weight:600;letter-spacing:.02em}
        .t .sub{opacity:.75;font-size:1.2rem;margin-left:.8rem}
        #clock{font-size:1.7rem}
        #row{position:absolute;left:calc(var(--ox) + 17.2rem);top:calc(var(--oy) + 9.7rem);display:flex;align-items:flex-start;gap:.8rem;transform:translateX(calc(var(--i)*-12.2rem));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
        .tile{position:relative;flex:none;width:11.4rem;height:11.4rem;margin-top:2rem;cursor:pointer;display:grid;place-items:center;transition:width .3s,height .3s,margin .3s}
        .tile.sel{width:18.75rem;height:21.9rem;margin-top:0;box-shadow:0 0 0 .25rem #8fe3ff,0 0 1.8rem rgba(130,225,255,.75)}
        .tile img,.launcher img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
        .fb{font-weight:600;font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase;padding:.8rem;text-align:center;word-break:break-all}
        .name{position:absolute;left:calc(100% + 1.4rem);bottom:0;white-space:nowrap;font-size:2.6rem;opacity:0;transition:opacity .3s}
        .start{display:none;position:absolute;left:0;right:0;bottom:0;height:3.4rem;background:rgba(14,28,84,.9);align-items:center;justify-content:center;font-size:1.5rem}
        .start i{position:absolute;right:.9rem;width:1.3rem;height:1.3rem;border:.2rem solid rgba(255,255,255,.7);border-radius:50%}
        .menu{position:absolute;top:calc(100% + .6rem);left:0;width:100%;background:rgba(12,24,80,.94);font-size:1.5rem;opacity:0;transition:opacity .3s}
        .raw-btn{display:block;width:100%;background:rgba(14,28,84,.94);border:1px solid rgba(255,255,255,.15);color:#fff;padding:.7rem 1rem;cursor:pointer;text-align:center;font-family:inherit;font-size:1.4rem;transition:background .2s,border-color .2s}
        .raw-btn:hover{background:rgba(24,54,140,.95);border-color:rgba(255,255,255,.3)}
        .raw-sub{display:block;font-size:1rem;opacity:.7;margin-top:.2rem;font-weight:300;letter-spacing:.02em}
        .sel .start{display:flex}
        .sel .menu,.sel .name{opacity:1}
        #foot{position:absolute;left:0;right:0;bottom:0;height:7rem;padding:.5rem 0 0 calc(var(--ox) + 4.4rem);border-top:1px solid rgba(255,255,255,.55);background:linear-gradient(#000,#050a1c);font-size:1.55rem;line-height:2.4rem}
        .launcher{position:fixed;z-index:20;overflow:hidden;display:grid;place-items:center;transition:all .7s cubic-bezier(.6,0,.2,1)}
        .launcher .name,.launcher .menu,.launcher .start{display:none}
        .playing .launcher{filter:brightness(.3)}
        .open .launcher{opacity:0}
        #loader{position:fixed;z-index:30;left:50%;bottom:14vh;width:min(360px,60vw);height:3px;margin-left:calc(min(360px,60vw)/-2);background:rgba(255,255,255,.2);overflow:hidden;opacity:0;transition:opacity .4s}
        #loader.on{opacity:1}
        #loader::after{content:"";position:absolute;top:0;bottom:0;width:35%;background:#fff;animation:slide 1.2s ease-in-out infinite}
        @keyframes slide{from{left:-35%}to{left:100%}}
        #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10;opacity:0;pointer-events:none;transition:opacity .5s}
        .open #game{opacity:1;pointer-events:auto}
        #exit{position:fixed;z-index:40;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
        #exit svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .open #exit{opacity:.4;pointer-events:auto}
        .open #exit:hover{opacity:1}
        @media(prefers-reduced-motion:reduce){#bg::before,#bg::after{animation:none}}
    </style>
</head>

<body>
    <div id="bg"></div>
    <div id="home">
        <header id="top">
            <div class="t" style="--x:5.2"><b>J</b></div>
            <div class="t" style="--x:13">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="#fff" stroke="none" />
                    <path d="M12 11v6M12 7.5v.5" stroke="#2457c3" />
                </svg><span class="nt">Jackpot</span><span class="sub">by tames.online</span></div>
            <div class="t" style="--x:50">
                <svg viewBox="0 0 24 24">
                    <path d="M3 5h11v8H8l-3 3v-3H3z M10 15h6l3 3v-3h2V9h-5" />
                </svg>
            </div>
            <div class="t" style="--x:56.5">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" stroke="none" />
                    <path d="M9 10v1.5M15 10v1.5M8.5 14.5q3.5 3 7 0" stroke="#2457c3" />
                </svg><span>Player 1</span></div>
            <div class="t" style="--x:81">
                <svg viewBox="0 0 24 24">
                    <path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v2a3 3 0 0 0 3 3 M17 6h3v2a3 3 0 0 1-3 3 M12 14v4 M8 20h8" />
                </svg><span>1</span></div>
            <div class="t" style="--x:89"><span id="clock"></span></div>
        </header>
        <main id="row"></main>
    </div>
    <iframe id="game" allow="fullscreen; autoplay; gamepad; clipboard-write"></iframe>
    <div id="loader"></div>
    <button id="exit" title="Back to home" onclick="exitGame()">
        <svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" />
        </svg>
    </button>
    <script>
        const games=[
        {logo:"https://media.rockstargames.com/rockstargames/img/global/news/upload/actual_1364906194.jpg",url:"https://fiveplay.lol/",name:"Grand Theft Auto V"},
        {logo:"/terraria.png",url:"https://maths.sparxlearning.xyz/games/terraria.html",name:"Terraria"},
        {logo:"https://image.api.playstation.com/vulcan/ap/rnd/202407/0401/670c294ded3baf4fa11068db2ec6758c63f7daeb266a35a1.png",url:"https://maths.sparxlearning.xyz/games/minecraft/index.html",name:"Minecraft"},
        {logo:"/sm64.png",url:"https://sites.google.com/view/emulatorjs/games/super-mario-64",name:"Super Mario 64"},
        ];
        
        const sounds={
          music: "/main.mp3",
          move: "/move.mp3",
          launch: "/launch.mp3",
          back: "/back.mp3"
        };
        
        const frame=document.getElementById("game");
        const loader=document.getElementById("loader");
        let i=0;
        let busy=false;
        let wheelAt=0;
        let ac;
        let pad;
        let music;
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));
        
        function tone(f,d,type,v,to){
        const o=ac.createOscillator();
        const g=ac.createGain();
        o.type=type;
        o.frequency.setValueAtTime(f,ac.currentTime);
        if(to)o.frequency.exponentialRampToValueAtTime(to,ac.currentTime+d);
        g.gain.setValueAtTime(v,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
        o.connect(g).connect(ac.destination);
        o.start();
        o.stop(ac.currentTime+d);
        }
        
        const sfx={
        move:()=>tone(1300,.09,"sine",.13,850),
        back:()=>tone(650,.18,"sine",.13,330),
        launch:()=>{
        [523,659,784,1047,1319].forEach((f,k)=>setTimeout(()=>tone(f,1,"sine",.1),k*85));
        tone(160,.9,"sawtooth",.035,1100);
        }
        };
        
        function play(n){
        if(sounds[n]){
          const audio = new Audio(sounds[n]);
          audio.volume = n === 'music' ? 0.35 : 0.7;
          audio.play().catch(() => {});
          return audio;
        }
        sfx[n]();
        }
        
        function unlock(){
        ac=new AudioContext();
        if(sounds.music){
          music = play("music");
          if(music) music.loop = true;
          return;
        }
        pad=ac.createGain();
        pad.gain.value=0;
        const lp=ac.createBiquadFilter();
        lp.type="lowpass";
        lp.frequency.value=900;
        const d=ac.createDelay();
        d.delayTime.value=.45;
        const fb=ac.createGain();
        fb.gain.value=.5;
        d.connect(fb).connect(d);
        lp.connect(d);
        [130.81,196,246.94,329.63,392].forEach((f,k)=>{
        const o=ac.createOscillator();
        const l=ac.createOscillator();
        const lg=ac.createGain();
        const g=ac.createGain();
        o.frequency.value=f;
        o.detune.value=k*3;
        l.frequency.value=.07+k*.03;
        lg.gain.value=.03;
        g.gain.value=.05;
        l.connect(lg).connect(g.gain);
        o.connect(g).connect(lp);
        o.start();
        l.start();
        });
        lp.connect(pad);
        d.connect(pad);
        pad.connect(ac.destination);
        pad.gain.linearRampToValueAtTime(.7,ac.currentTime+4);
        }
        
        addEventListener("pointerdown",unlock,{once:true});
        addEventListener("keydown",unlock,{once:true});
        
        function tick(){
        document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
        }
        tick();
        setInterval(tick,1000);
        
        const tiles=games.map((g,n)=>{
        const host=new URL(g.url).hostname.replace(/^www\./,"");
        const t=document.createElement("div");
        t.className="tile";
        t.style.background=`linear-gradient(135deg,hsl(${n*57%360} 70% 45%),hsl(${n*57%360+40} 70% 22%))`;
        t.innerHTML=`<span class="fb">${host}</span><div class="start">Start<i></i></div><div class="menu"><button class="raw-btn" onclick="openRaw(event, ${n})">Open Raw URI<span class="raw-sub">Use if default isn't working</span></button></div><div class="name">${g.name}</div>`;
        if(g.logo){
        const img=new Image();
        img.src=g.logo;
        img.onerror=()=>img.remove();
        t.prepend(img);
        }
        t.onclick=()=>n===i?launch():select(n);
        document.getElementById("row").append(t);
        return t;
        });
        
        function select(n){
        const c=Math.max(0,Math.min(games.length-1,n));
        if(c!==i)play("move");
        i=c;
        document.documentElement.style.setProperty("--i",i);
        tiles.forEach((t,k)=>t.classList.toggle("sel",k===i));
        }
        select(0);
        
        function openRaw(e, n){
          e.stopPropagation();
          play("launch");
          window.open(games[n].url, '_blank');
        }
        
        async function launch(){
        if(busy)return;
        busy=true;
        play("launch");
        
        if(music){
          music.pause();
          music.currentTime = 0;
        }
        
        const r=tiles[i].getBoundingClientRect();
        const l=tiles[i].cloneNode(true);
        l.className="launcher";
        l.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
        document.body.append(l);
        l.offsetWidth;
        document.body.classList.add("playing");
        l.style.cssText="left:0;top:0;width:100%;height:100%";
        await sleep(700);
        loader.classList.add("on");
        frame.src=games[i].url;
        await Promise.all([sleep(2200),Promise.race([new Promise(d=>frame.onload=d),sleep(8000)])]);
        document.body.classList.add("open");
        frame.focus();
        await sleep(700);
        loader.classList.remove("on");
        l.remove();
        busy=false;
        }
        
        function exitGame(){
        if(!document.body.classList.contains("open"))return;
        play("back");
        
        if(music){
          music.play().catch(()=>{});
        }
        
        document.body.classList.remove("open","playing");
        sleep(600).then(()=>frame.src="about:blank");
        }
        
        addEventListener("keydown",e=>{
        if(document.body.classList.contains("playing"))return e.key==="Escape"&&exitGame();
        if(e.key==="ArrowRight")select(i+1);
        if(e.key==="ArrowLeft")select(i-1);
        if(e.key==="Enter")launch();
        });
        
        addEventListener("wheel",e=>{
        if(document.body.classList.contains("playing")||Date.now()-wheelAt<180)return;
        wheelAt=Date.now();
        select(i+(e.deltaY+e.deltaX>0?1:-1));
        });
    </script>
</body>

</html>
